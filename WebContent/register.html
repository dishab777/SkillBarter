<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration — SkillBarter</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar" id="mainNav">
    <a href="index.html" class="brand">
      <span class="brand-icon">SB</span> SkillBarter
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="register.html" class="active">Register</a></li>
    </ul>
  </nav>

  <main class="narrow-container">
    <div class="card">
      <div class="card-header">
        <h2>Create Student Account</h2>
      </div>

      <div id="alertBox" class="alert"></div>

      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" placeholder="e.g. Alex Morgan" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="email">College Email Address *</label>
          <input type="email" id="email" name="email" placeholder="alex@college.edu" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password *</label>
          <input type="password" id="password" name="password" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="department">Department / Branch *</label>
          <input type="text" id="department" name="department" placeholder="e.g. Computer Science and Engineering" required>
        </div>

        <div class="form-group">
          <label for="semester">Current Semester (1 - 12) *</label>
          <input type="number" id="semester" name="semester" min="1" max="12" placeholder="e.g. 3" required>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block">
          Create Account
        </button>
      </form>

      <p style="text-align: center; margin-top: 1.25rem; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="color: var(--secondary); font-weight: 600;">Log in here</a>
      </p>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 SkillBarter — Peer Skill Exchange Platform</p>
  </footer>

  <script src="js/app.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      const submitBtn = document.getElementById('submitBtn');
      SkillBarter.clearAlert(alertBox);

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const department = document.getElementById('department').value.trim();
      const semester = parseInt(document.getElementById('semester').value, 10);

      // Client-side validations
      if (!name || !email || !password || !department || isNaN(semester)) {
        SkillBarter.showAlert(alertBox, 'Please complete all required fields.', 'danger');
        return;
      }
      if (password.length < 6) {
        SkillBarter.showAlert(alertBox, 'Password must be at least 6 characters long.', 'danger');
        return;
      }
      if (semester < 1 || semester > 12) {
        SkillBarter.showAlert(alertBox, 'Semester must be between 1 and 12.', 'danger');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Registering account...';

      const res = await SkillBarter.apiCall('api/register', 'POST', {
        name, email, password, department, semester: String(semester)
      });

      submitBtn.disabled = false;
      submitBtn.textContent = 'Create Account';

      if (res.ok && res.data.success) {
        SkillBarter.showAlert(alertBox, res.data.message || 'Account created successfully! Redirecting to login...', 'success');
        document.getElementById('registerForm').reset();
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1500);
      } else {
        SkillBarter.showAlert(alertBox, res.data.message || 'Registration failed. Please check your information.', 'danger');
      }
    }
  </script>
</body>
</html>
